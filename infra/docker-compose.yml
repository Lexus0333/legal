services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    build:
      context: .
      args:
        N8N_VERSION: ${N8N_VERSION}
    image: n8n-ffmpeg:${N8N_VERSION}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: https
      N8N_PROXY_HOPS: "1"
      WEBHOOK_URL: https://${N8N_HOST}/
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
      # Разрешаем узел Execute Command (в n8n 2.x он выключен) - нужен для запуска ffmpeg
      NODES_EXCLUDE: "[]"
      NODE_FUNCTION_ALLOW_BUILTIN: "fs,https,http,path,crypto"   # нужно для потоковой загрузки видео в TikTok (узел Upload to TikTok)
      # Узлы работы с файлами видят только эту папку
      N8N_RESTRICT_FILE_ACCESS_TO: /files
      # Разрешаем $env в выражениях воркфлоу (ключи TikTok и т.п. берутся из .env)
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET}
      TIKTOK_PRIVACY: ${TIKTOK_PRIVACY:-SELF_ONLY}
      CONNECT_SECRET: ${CONNECT_SECRET}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      POST_JITTER_SEC: ${POST_JITTER_SEC:-900}
      # Публикация из папки inbox: ИИ для хука и подписи (любой сервис с OpenAI-совместимым API), паузы, тест без публикации
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_LANGUAGE: ${AI_LANGUAGE:-}
      DEFAULT_ACCOUNT: ${DEFAULT_ACCOUNT:-account1}
      POST_PAUSE_MIN_SEC: ${POST_PAUSE_MIN_SEC:-300}
      POST_PAUSE_MAX_SEC: ${POST_PAUSE_MAX_SEC:-900}
      DRY_RUN: ${DRY_RUN:-0}
      MAX_POSTS_PER_RUN: ${MAX_POSTS_PER_RUN:-5}
      DEFAULT_CAPTION: ${DEFAULT_CAPTION:-}
      DEFAULT_HASHTAGS: ${DEFAULT_HASHTAGS:-}
      POOL_LANG: ${POOL_LANG:-en}
      STATS_ENABLED: ${STATS_ENABLED:-0}
      # Музыка: off | silent (только видео без звука) | mix (и к видео со звуком, тише оригинала)
      MUSIC_MODE: ${MUSIC_MODE:-silent}
      MUSIC_VOLUME: ${MUSIC_VOLUME:-1}
      MUSIC_SILENCE_DB: ${MUSIC_SILENCE_DB:--45}
      MOOD_MOTION_HIGH: ${MOOD_MOTION_HIGH:-10}
      MOOD_LUMA_DARK: ${MOOD_LUMA_DARK:-105}
      # Чистим старую историю запусков, чтобы диск не раздувался
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./files:/files
    # Порт 5678 наружу НЕ открываем - заходим только через Caddy (HTTPS)

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - n8n
    ports:
      - "80:80"
      - "443:443"
    environment:
      N8N_HOST: ${N8N_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  n8n_data:
  caddy_data:
  caddy_config:
